name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-analysis:
    name: Python analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --all-groups

      - name: Run Python analysis (headless)
        run: uv run python scripts/wine-data-analysis.py --no-show

      - name: Verify figures generated
        run: |
          echo "Checking figures/*.png exists..."
          ls -lh figures/
          test -f figures/wine_quality_counts.png
          test -f figures/correlation_heatmap.png
          test -f figures/pca_scree.png
          test -f figures/pca_biplot.png
          echo "All expected figures present."

      - name: Upload Python figures artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: figures-python
          path: figures/
          if-no-files-found: error

  r-analysis:
    name: R analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.3"
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev \
            pandoc

      - name: Set up R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::corrplot
            any::factoextra
            any::rmarkdown

      - name: Run R analysis
        run: Rscript scripts/Wine_Quality_Analysis.R

      - name: Verify R outputs
        run: |
          echo "Checking output/*.png exists..."
          ls -lh output/
          test -f output/wine-1.png
          test -f output/wine-4.png
          test -f output/wine-8.png
          echo "All expected R outputs present."

      - name: Render RMarkdown report
        if: success()
        run: Rscript -e "rmarkdown::render('reports/report.Rmd', output_dir='output')"

      - name: Upload R outputs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-r
          path: output/
          if-no-files-found: error

  tests:
    name: Placeholder tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - name: Run pytest placeholders
        run: uv run pytest tests/ -v
      - name: Run ruff placeholder lint
        run: uv run ruff check scripts/ tests/ || true

  # Optional: verify Makefile pipeline still works (smoke test)
  make-smoke:
    name: Make smoke test
    runs-on: ubuntu-latest
    needs: [python-analysis]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - name: Run make python target
        run: make python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: figures-make
          path: figures/
