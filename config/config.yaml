# URLS
data:
  red:   https://archive.ics.uci.edu/ml/machine-learning-databases/wine-quality/winequality-red.csv
  white: https://archive.ics.uci.edu/ml/machine-learning-databases/wine-quality/winequality-white.csv

# Output
output:
  r_dir: output
  python_dir: figures
  report_dir: output

# Analysis params
analysis:
  seed: 123
  test_size: 0.30
  pca:
    scale: true
    center: true
  regression:
    formula: num_quality ~ alcohol + sulphates + pH + type
  clustering:
    k: 3
    nstart: 25
  classification:
    target: high_quality
    threshold: 7

# Plot
plot:
  dpi: 150
  theme: minimal
  palette: viridis
